name: Build and test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ConsoleMVC.sln

      - name: Build
        run: dotnet build ConsoleMVC.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test ConsoleMVC.sln --configuration Release --no-build --verbosity normal
