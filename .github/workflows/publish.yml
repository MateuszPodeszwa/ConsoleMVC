name: Publish packages

# Publishes ConsoleMVC.Framework and ConsoleMVC.Template to NuGet.org and GitHub Packages when a GitHub release is
# published. The release tag must match the package versions, e.g. tag v1.9.0 for <Version>1.9.0</Version>.
#
# Setup (once): add a repository secret NUGET_API_KEY with an API key from https://www.nuget.org/account/apikeys
# (scope: push, glob pattern ConsoleMVC.*). GitHub Packages uses the built-in GITHUB_TOKEN.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match the .csproj versions), e.g. 1.9.0"
        required: true

permissions:
  contents: write   # attach the packages to the release
  packages: write   # push to GitHub Packages

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check the version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          version="${RELEASE_TAG:-$INPUT_VERSION}"
          version="${version#v}"
          for project in src/ConsoleMVC/ConsoleMVC.csproj ConsoleMVC.Template.csproj; do
            declared=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$project" | head -n 1)
            if [ "$declared" != "$version" ]; then
              echo "::error::$project declares version $declared, but the release is $version"
              exit 1
            fi
          done
          if ! grep -q "Include=\"ConsoleMVC.Framework\" Version=\"$version\"" templates/ConsoleMVC.App/ConsoleMVC.App.csproj; then
            echo "::error::The template does not reference ConsoleMVC.Framework $version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore ConsoleMVC.sln

      - name: Build
        run: dotnet build ConsoleMVC.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test ConsoleMVC.sln --configuration Release --no-build

      - name: Pack
        run: |
          dotnet pack src/ConsoleMVC/ConsoleMVC.csproj --configuration Release --no-build --output nupkg
          dotnet pack ConsoleMVC.Template.csproj --configuration Release --output nupkg

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::warning::NUGET_API_KEY is not set; skipping NuGet.org"
            exit 0
          fi
          dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "nupkg/*.nupkg"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate

      - name: Attach the packages to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" nupkg/*.nupkg --clobber
