site_name: ConsoleMVC
site_url: ""
docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Controllers and Forms: controllers-and-forms.md
  - C-View Markup: c-view-markup.md
  - Validation: validation.md
  - Dependency Injection: dependency-injection.md
  - Async Actions and Middleware: async-and-middleware.md
  - Configuration Files and Logging: hosting.md
  - Builder Options: configuration.md
  - Testing: testing.md
  - API Reference: ../api/
